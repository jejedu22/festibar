# Production : une seule image (API Express + frontend compilé)
# Lancement : docker compose up -d --build
services:
  festibar:
    build: .
    image: festibar:latest
    container_name: festibar
    restart: unless-stopped
    ports:
      - "${FESTIBAR_PORT:-3001}:3001"
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.local
        required: false
    environment:
      PORT: 3001
      SQLITE_FILE: /app/data/bar.db
    volumes:
      # Base SQLite persistée sur l'hôte (./data/bar.db)
      - ./data:/app/data
