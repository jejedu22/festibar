# Développement : backend (nodemon) + frontend (Vite) avec rechargement à chaud
# Lancement : docker compose -f docker-compose.dev.yml up
services:
  backend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:3001"
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.local
        required: false
    environment:
      PORT: 3001
      SQLITE_FILE: /data/bar.db
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./data:/data

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "8001:8001"
    environment:
      API_PROXY_TARGET: http://backend:3001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
